<div style="position:relative;width:1280px;height:720px;overflow:hidden;background:#0f1c19;font-family:Inter,'Segoe UI',sans-serif;color:#e8efe9">

  <!-- затемнённый стол на фоне -->
  <div style="position:absolute;left:290px;top:140px;width:700px;height:400px;border-radius:14px;background:linear-gradient(180deg,#4aa78f,#3f9680);opacity:.55;transform:perspective(900px) rotateX(40deg)"></div>
  <div style="position:absolute;left:0;top:0;width:1280px;height:720px;background:rgba(10,20,18,.72)"></div>

  <!-- панель -->
  <div style="position:absolute;left:50%;margin-left:-243px;top:48px;width:486px;box-sizing:border-box;padding:20px 22px 18px;background:#16282a;border:1px solid #2a4340;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5)">
    <div style="text-align:center;font-family:'Playfair Display',serif;font-weight:700;font-size:34px;color:#d4a853;letter-spacing:.02em;margin-bottom:16px">Пауза</div>

    <!-- главное действие -->
    <div style="height:46px;display:flex;align-items:center;justify-content:center;gap:10px;background:#2e8f77;border-radius:10px;font-size:19px;font-weight:700;color:#08120f;box-shadow:0 0 0 3px rgba(130,212,184,.45)">
      <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="#08120f" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
      Вернуться за стол
    </div>

    <div style="margin:16px 4px 6px;font-size:12px;font-weight:600;letter-spacing:.12em;color:#9fb3ab">ПАРТИЯ</div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <sc-for list="{{game}}" as="r" hint-placeholder-count="4">
        <div style="height:40px;box-sizing:border-box;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#1e3335;border-radius:8px;font-size:18px">
          <span>{{r.label}}</span><span style="font-size:13px;font-weight:600;color:#d4a853">{{r.key}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin:16px 4px 6px;font-size:12px;font-weight:600;letter-spacing:.12em;color:#9fb3ab">НАСТРОЙКИ</div>
    <div style="height:40px;box-sizing:border-box;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#1e3335;border-radius:8px;font-size:18px">
      <span>Настройки</span>
      <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#9fb3ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
